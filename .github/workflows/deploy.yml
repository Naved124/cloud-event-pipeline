name: Deploy Pipeline to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via AWS SSM
        run: |
          cat > params.json << 'EOF'
          {
            "commands": [
              "which git || (apt-get update -y && apt-get install -y git)",
              "if [ -d /home/ubuntu/cloud-event-pipeline ]; then cd /home/ubuntu/cloud-event-pipeline && git pull; else git clone https://github.com/Naved124/cloud-event-pipeline.git /home/ubuntu/cloud-event-pipeline; fi",
              "echo DB_USER=${{ secrets.DB_USER }} > /home/ubuntu/cloud-event-pipeline/.env",
              "echo DB_PASSWORD=${{ secrets.DB_PASSWORD }} >> /home/ubuntu/cloud-event-pipeline/.env",
              "echo DB_NAME=${{ secrets.DB_NAME }} >> /home/ubuntu/cloud-event-pipeline/.env",
              "docker compose -f /home/ubuntu/cloud-event-pipeline/docker-compose.yml down",
              "docker compose -f /home/ubuntu/cloud-event-pipeline/docker-compose.yml up -d --build"
            ]
          }
          EOF
          
          # 1. Send the command using the tag and capture the Command ID
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=CloudEventPipelineServer" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --query "Command.CommandId" \
            --output text)
            
          echo "Command queued with ID: $COMMAND_ID"
          
          # 2. Dynamically fetch the ID of the running instance that has the tag
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=CloudEventPipelineServer" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
            
          echo "Waiting for execution on instance: $INSTANCE_ID..."
          
          # 3. Block the pipeline until the server reports Success or Failed
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"